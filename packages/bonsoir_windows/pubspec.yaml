version: 7.3.1
resolution: workspace

environment:
  sdk: '>=3.13.0 <4.0.0'

flutter:
  plugin:
    implements: bonsoir
    platforms:
      windows:
        pluginClass: BonsoirWindowsPluginCApi

dependencies:
  flutter:
    sdk: flutter
  bonsoir_platform_interface: ^7.0.1
